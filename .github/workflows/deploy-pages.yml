# Publishes the static site to GitHub Pages on every push to main.
# After the first successful run: Repo → Settings → Pages → confirm "GitHub Actions" is the source.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Bot commits from GITHUB_TOKEN do NOT fire `push`, so explicitly chain
  # off our data-sync workflows. Without this, data/availability-*.json and
  # data/pricing-*.json refresh in the repo but the live site keeps serving
  # the last human-deployed version (broke June 2026: 13 days of OTA bookings
  # were committed but never deployed).
  workflow_run:
    workflows:
      - Sync iCal availability
      - Sync PriceLabs pricing
    types: [completed]
    branches: [main]
  # Lets you re-deploy on demand from the Actions tab (e.g. recover from a
  # missed bot-triggered deploy without making a code commit).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip if the upstream sync workflow failed; still deploy on direct `push` or manual run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject Web3Forms key from Actions secret (idempotent)
        # Web3Forms keys are per-domain frontend tokens (safe to commit). We keep a real key in
        # `config.js` so local `npx serve` works out of the box, but production still gets to
        # rotate via the Actions secret without a code change: if the placeholder
        # `__WEB3FORMS_ACCESS_KEY__` is present we replace it; otherwise we overwrite the
        # committed literal with the secret. Missing secret is a warning, not a hard failure,
        # so local dev never blocks deploys — the committed key still ships.
        env:
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
        run: |
          if [ -z "${WEB3FORMS_ACCESS_KEY:-}" ]; then
            echo "::warning::Repository secret WEB3FORMS_ACCESS_KEY is not set. The key committed in config.js will ship as-is. Set the secret to rotate without a code change."
            exit 0
          fi
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          k = os.environ['WEB3FORMS_ACCESS_KEY'].strip()
          assert k, 'WEB3FORMS_ACCESS_KEY is empty'
          p = Path('config.js')
          t = p.read_text(encoding='utf-8')
          placeholder = '__WEB3FORMS_ACCESS_KEY__'
          if placeholder in t:
              t = t.replace(placeholder, k)
              print(f'Replaced placeholder with secret ({len(k)} chars).')
          else:
              new_t, n = re.subn(
                  r"const WEB3FORMS_ACCESS_KEY = '[^']*';",
                  f"const WEB3FORMS_ACCESS_KEY = '{k}';",
                  t,
                  count=1,
              )
              assert n == 1, 'Could not locate WEB3FORMS_ACCESS_KEY assignment in config.js'
              t = new_t
              print(f'Overwrote committed key literal with secret ({len(k)} chars).')
          p.write_text(t, encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dev dependencies (sharp for OG image generation)
        run: npm ci --include=dev

      - name: Generate sitemap.xml from PROPERTIES
        run: node scripts/generate-sitemap.cjs

      - name: Generate Open Graph preview cards (1200x630)
        run: node scripts/generate-og-images.cjs

      - name: Generate per-listing share pages (listing-<id>.html)
        run: node scripts/generate-listing-pages.cjs

      - name: Inject Cloudflare Web Analytics beacon (optional, processes listing-*.html too)
        env:
          CLOUDFLARE_BEACON_TOKEN: ${{ secrets.CLOUDFLARE_BEACON_TOKEN }}
        run: node scripts/inject-cf-beacon.cjs

      - name: Inject Microsoft Clarity tag (optional, processes listing-*.html too)
        env:
          CLARITY_PROJECT_ID: ${{ secrets.CLARITY_PROJECT_ID }}
        run: node scripts/inject-clarity.cjs

      - name: Inject static per-listing VacationRental JSON-LD into index.html
        run: node scripts/generate-listing-schema.cjs

      - name: Cache-bust styles.css / app.js references with commit SHA
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/cache-bust.cjs

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
