s we had. Would definitely stay again.","author":{"@type":"Person","name":"Jesika"},"reviewRating":{"@type":"Rating","ratingValue":5,"bestRating":5,"worstRating":1}},{"@type":"Review","datePublished":"2025-10-15","reviewBody":"We loved everything about the condo. The view was beautiful and quiet. Simone was great to work with and always responded! We will definitely come back!","author":{"@type":"Person","name":"Robbilyn"},"reviewRating":{"@type":"Rating","ratingValue":5,"bestRating":5,"worstRating":1}},{"@type":"Review","datePublished":"2025-06-15","reviewBody":"Over all this was a great place to stay. Host is friendly and very helpful through the whole process. (If I read thru everything that was sent I would not have needed to contact her.)","author":{"@type":"Person","name":"Debbie"},"reviewRating":{"@type":"Rating","ratingValue":5,"bestRating":5,"worstRating":1}},{"@type":"Review","datePublished":"2024-04-15","reviewBody":"Simone was lovely to work with! The view was definitely worth it. We walked to Pier Park and it was a fun place to be right in the middle of everything!","author":{"@type":"Person","name":"Samantha"},"reviewRating":{"@type":"Rating","ratingValue":5,"bestRating":5,"worstRating":1}},{"@type":"Review","datePublished":"2026-04-15","reviewBody":"Loved this condo! Beautiful view and the host was exceptional.","author":{"@type":"Person","name":"Ashley"},"reviewRating":{"@type":"Rating","ratingValue":5,"bestRating":5,"worstRating":1}},{"@type":"Review","datePublished":"2025-03-15","reviewBody":"Perfect getaway for my husband, mom, daughter and her friend. Will definitely come back. Host was super responsive!","author":{"@type":"Person","name":"Anita"},"reviewRating":{"@type":"Rating","ratingValue":5,"bestRating":5,"worstRating":1}},{"@type":"Review","datePublished":"2024-05-15","reviewBody":"Clean condo, fully equipped, with quick access to the beach.","author":{"@type":"Person","name":"Todd"},"reviewRating":{"@type":"Rating","ratingValue":5,"bestRating":5,"worstRating":1}},{"@type":"Review","datePublished":"2024-07-15","reviewBody":"The Airbnb was great in all ways.","author":{"@type":"Person","name":"Tara"},"reviewRating":{"@type":"Rating","ratingValue":5,"bestRating":5,"worstRating":1}},{"@type":"Review","datePublished":"2025-05-15","reviewBody":"We had a great time and the host was excellent to work with. The condo was in perfect condition with plenty of room.","author":{"@type":"Person","name":"Danielle"},"reviewRating":{"@type":"Rating","ratingValue":5,"bestRating":5,"worstRating":1}},{"@type":"Review","datePublished":"2026-06-15","reviewBody":"We had a blast. A few things were messed up in the room but the host jumped right on having someone come check it and fix it! It was a good choice for my family!","author":{"@type":"Person","name":"Megan"},"reviewRating":{"@type":"Rating","ratingValue":5,"bestRating":5,"worstRating":1}},{"@type":"Review","datePublished":"2026-02-23","reviewBody":"Right on the water! So easy for a family to enjoy the beach. All the other guests were exceptionally kind. We stopped on a road trip during the off season, so the indoor pool was a bonus.","author":{"@type":"Person","name":"Stephanie"},"reviewRating":{"@type":"Rating","ratingValue":5,"bestRating":5,"worstRating":1}},{"@type":"Review","datePublished":"2026-03-15","reviewBody":"Beach view was absolutely beautiful from our balcony.","author":{"@type":"Person","name":"Darlene"},"reviewRating":{"@type":"Rating","ratingValue":5,"bestRating":5,"worstRating":1}},{"@type":"Review","datePublished":"2025-04-15","reviewBody":"Great place and great view toward the beach! Place was clean. Enough space for our group of 7!","author":{"@type":"Person","name":"Estefania"},"reviewRating":{"@type":"Rating","ratingValue":5,"bestRating":5,"worstRating":1}}]}</script>

    <script type="application/ld+json" data-schema="faq-4">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Is parking included?","acceptedAnswer":{"@type":"Answer","text":"Yes — up to two on-site parking passes are included with the Resort Registration Fee, plus wristbands for all occupants over age 12. Registration details are in the pre-arrival email."}},{"@type":"Question","name":"How do I get to the beach from the condo?","acceptedAnswer":{"@type":"Answer","text":"Direct beach access from the resort — elevator down, cross the resort deck, and you're on the sand."}},{"@type":"Question","name":"What's the cancellation policy?","acceptedAnswer":{"@type":"Answer","text":"Full refund if you cancel 46 or more days before check-in. 50% refund for cancellations 31–45 days out. Non-refundable within 30 days of check-in."}},{"@type":"Question","name":"Are beach chairs and an umbrella provided?","acceptedAnswer":{"@type":"Answer","text":"Complimentary beach chairs and umbrella are available in the condo for you to use throughout your stay. If you'd prefer a full setup on the sand, beach chair and umbrella rental is also available for purchase directly on the beach from local vendors."}},{"@type":"Question","name":"Are pets allowed?","acceptedAnswer":{"@type":"Answer","text":"No pets."}},{"@type":"Question","name":"What are the check-in and check-out times?","acceptedAnswer":{"@type":"Answer","text":"Check-in from 4:00 PM. Check-out by 10:00 AM. Precise arrival instructions and the lockbox code are emailed the morning of check-in."}},{"@type":"Question","name":"Is the Wi-Fi fast enough for streaming and remote work?","acceptedAnswer":{"@type":"Answer","text":"High-speed Wi-Fi throughout the condo, suitable for streaming and video calls on multiple devices at once."}},{"@type":"Question","name":"How far is Pier Park?","acceptedAnswer":{"@type":"Answer","text":"About 1 mile — an easy short drive, and a walkable option in cooler months. Pier Park has shops, restaurants, and family entertainment."}},{"@type":"Question","name":"What's the closest airport?","acceptedAnswer":{"@type":"Answer","text":"ECP (Northwest Florida Beaches International) — about 35 minutes by car. Uber and Lyft are widely available at the airport."}},{"@type":"Question","name":"When is the best time of year to visit?","acceptedAnswer":{"@type":"Answer","text":"Weather is warmest May through October. Shoulder seasons (late April, September, and early October) have the best value with the least crowded beach. Ask Simone directly for date-specific advice."}}]}</script>
